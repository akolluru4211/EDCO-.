apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-orchestrator
  labels:
    app: interview-orchestrator
    tier: backend-compute
    app.kubernetes.io/name: edworld-interview-orchestrator
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: interview-orchestrator
  template:
    metadata:
      labels:
        app: interview-orchestrator
        tier: backend-compute
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: interview-orchestrator
          image: gcr.io/edworld-co/interview-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8081"
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: edworld-internal-secrets
                  key: internal-service-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: edworld-api-keys
                  key: openai-api-key
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "800m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
