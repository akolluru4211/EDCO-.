# ==============================================================================
# Edworld Co — Kubernetes Secrets Template
# NEVER commit raw plaintext secrets to source control.
# In production, inject via Google Secret Manager or Sealed Secrets.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: edworld-internal-secrets
type: Opaque
stringData:
  internal-service-secret: "YOUR_SECURE_INTERNAL_CLUSTER_SECRET_HERE"
---
apiVersion: v1
kind: Secret
metadata:
  name: edworld-api-keys
type: Opaque
stringData:
  openai-api-key: "YOUR_OPENAI_API_KEY_HERE"
  openrouter-api-key: "YOUR_OPENROUTER_API_KEY_HERE"
