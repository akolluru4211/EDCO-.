apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-interview-scorer
  namespace: edworld-prod
  labels:
    app: flask-interview-scorer
    tier: compute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-interview-scorer
  template:
    metadata:
      labels:
        app: flask-interview-scorer
        tier: compute
    spec:
      containers:
        - name: flask-scorer
          image: edworld-registry.azurecr.io/flask-interview-scorer:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: edworld-internal-secrets
                  key: flask-service-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: edworld-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flask-scoring-service
  namespace: edworld-prod
  labels:
    app: flask-interview-scorer
spec:
  type: ClusterIP # STRICTLY INTERNAL ONLY — NEVER EXPOSED VIA INGRESS
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: flask-interview-scorer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-scorer-hpa
  namespace: edworld-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-interview-scorer
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
